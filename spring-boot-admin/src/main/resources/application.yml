server:
  port: 8089

spring:
  datasource:
    url: jdbc:mysql://localhost:3306/ai_test?createDatabaseIfNotExist=true&useUnicode=true&characterEncoding=utf-8&serverTimezone=Asia/Shanghai&useSSL=false&allowPublicKeyRetrieval=true
    username: root
    password: root
    driver-class-name: com.mysql.cj.jdbc.Driver
  sql:
    init:
      mode: always
      continue-on-error: true
      encoding: UTF-8
  jackson:
    date-format: yyyy-MM-dd HH:mm:ss
    time-zone: GMT+8

mybatis:
  mapper-locations: classpath:mapper/*.xml
  type-aliases-package: com.example.admin.entity
  configuration:
    map-underscore-to-camel-case: true

management:
  endpoints:
    web:
      exposure:
        include: health,info,metrics
  endpoint:
    health:
      show-details: always

springdoc:
  api-docs:
    path: /v3/api-docs
  group-configs:
    - group: 认证管理
      display-order: 1
      paths-to-match: /api/login, /api/logout, /api/user/info, /api/menus/routers
      packages-to-scan: com.example.admin.controller
    - group: 系统管理
      display-order: 2
      paths-to-match: /api/users/**, /api/roles/**, /api/menus/**, /api/depts/**, /api/posts/**, /api/dict-types/**, /api/dict-data/**, /api/configs/**, /api/notices/**
      packages-to-scan: com.example.admin.controller
    - group: 系统监控
      display-order: 3
      paths-to-match: /api/oper-logs/**, /api/login-logs/**, /api/online-users/**, /api/jobs/**, /api/monitor/**
      packages-to-scan: com.example.admin.controller
    - group: 系统工具
      display-order: 4
      paths-to-match: /api/gen/**
      packages-to-scan: com.example.admin.controller

knife4j:
  enable: true
  setting:
    language: zh_cn
    enable-swagger-models: true
    swagger-model-name: 实体类列表
